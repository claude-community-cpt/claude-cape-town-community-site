# Checks that the site builds and works. Runs on every pull request, and is
# reused by pages.yml so nothing is published unless these pass.
name: Checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Validate HTML
        run: npm run lint:html

      - name: Check internal links
        run: npm run lint:links

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (desktop and phone, light and dark, accessibility)
        run: npm test

      - name: Attach the built site for preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: dist
          include-hidden-files: true
          retention-days: 7
