# Extra security checks, on top of CodeQL (codeql.yml).
#   dependencies  stops a pull request that adds a package with a known
#                 vulnerability, and checks installed packages are genuine
#   workflows     checks the files in .github/workflows for unsafe patterns
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "10 4 * * 1" # Mondays: new advisories appear without any code change

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review packages added by this pull request
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install exactly what the lock file lists, without running package scripts
        run: npm ci --ignore-scripts

      - name: Check package signatures and provenance
        run: npm audit signatures

      - name: Check for known vulnerabilities
        run: npm audit --audit-level=high

  workflows:
    name: Workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          min-severity: medium
